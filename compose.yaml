services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - oxium_mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: OXIUM_DB
    ports:
      - "5050:5050"

volumes:
  oxium_mongo_data:
